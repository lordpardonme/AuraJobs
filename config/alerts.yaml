# ============================================================
# AURAJOBS DAILY ALERTS CONFIGURATION
# ============================================================
# Generated by: python alerts.py --setup
# All secrets MUST be provided via environment variables:
#   TELEGRAM_BOT_TOKEN - Bot token from @BotFather
#   TELEGRAM_CHAT_ID   - Your chat ID (auto-captured during pairing)
# ============================================================

schedule:
  # Cron expression for scheduled runs (uses system local timezone)
  # Examples:
  #   "0 8 * * *"     - Daily at 8:00 AM
  #   "0 9 * * 1-5"   - Weekdays at 9:00 AM
  #   "0 */6 * * *"   - Every 6 hours
  cron: "0 8 * * *"

  # IANA timezone (e.g., "Asia/Kolkata", "America/New_York", "UTC")
  # Defaults to system local timezone if not specified
  timezone: ""

telegram:
  enabled: true

  # Minimum match score (0-100) for a job to trigger an alert
  min_match_score: 75

  # Maximum number of job cards to send per alert
  max_alert_cards: 5

  # Send the full consolidated CSV as a document attachment
  send_csv_digest: true

  # Include jobs with visa sponsorship mentions
  include_visa_sponsored: true

  # Include jobs offering relocation assistance
  include_relocation: true

filters:
  # Regions to include in alerts (empty = all regions from search profile)
  # Options: "India", "Middle East", "Global"
  regions: []

  # Seniority levels to include (empty = all)
  # Options: "Intern", "Junior", "Mid-Level", "Senior", "Staff", "Lead", "Principal"
  seniority: []

  # Only alert on jobs explicitly mentioning visa sponsorship
  visa_required: false

  # Only alert on jobs explicitly mentioning relocation
  relocation_required: false

  # Keywords that must appear in title or description (OR logic)
  # Empty = no keyword filtering
  keywords: []

  # Keywords that exclude a job if found (AND logic with other filters)
  exclude_keywords: []

deduplication:
  enabled: true

  # Time-to-live for sent job records in days
  # Jobs older than this will be re-alerted if they appear again
  ttl_days: 30

  # Storage backend: "sqlite" (recommended) or "json"
  store_type: "sqlite"

  # Path for SQLite database (relative to project root)
  db_path: "alerts/alert_state.db"

logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Log file path (relative to project root, empty = stdout only)
  file_path: "alerts/alerts.log"

  # Structured JSON logging for observability
  json_format: false