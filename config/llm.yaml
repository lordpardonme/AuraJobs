# ============================================================
# LLM PROVIDER CONFIGURATION - AURAJOBS ENGINE
# ============================================================
#
# Supported providers:
#   - litellm: Unified interface for 100+ providers (Groq, Gemini, Mistral, Ollama, etc.)
#   - ollama: Local Ollama via OpenAI-compatible endpoint
#   - openai_compatible: Generic OpenAI-compatible (Groq, OpenRouter, Together AI, etc.)
#   - gemini: Direct Google Gemini via google-genai SDK
#
# Provider-specific notes:
#   - litellm: Best for switching between providers; just change the model string
#   - ollama: Fully local, no API key needed; run `ollama serve` first
#   - openai_compatible: Direct control over specific provider endpoints
#   - gemini: Best for Google Gemini native features
#
# Model string examples:
#   - litellm: "groq/llama-3.1-8b-instant", "gemini/gemini-2.5-flash", "ollama/qwen2.5:7b"
#   - ollama: "qwen2.5:7b", "llama3.2:3b", "gemma3:4b"
#   - openai_compatible: "llama-3.1-8b-instant" (Groq), "google/gemma-2-9b-it:free" (OpenRouter)
#   - gemini: "gemini-2.5-flash", "gemini-2.5-pro"
#
# Free tier recommendations:
#   - Groq: 14,400 req/day (prompt-guard), 1,000 req/day (GPT-OSS 20B/120B, Qwen 27B)
#   - OpenRouter: 50 req/day free, 1,000/day with $10+ credits, use "openrouter/free" for auto
#   - Google Gemini: Dynamic per-project limits (check Google AI Studio)
#   - Ollama: Unlimited local inference
#
# ============================================================

provider: "litellm"
model: "groq/llama-3.1-8b-instant"

# Provider-specific parameters
temperature: 0.1
max_tokens: 1000

# Optional: Override API keys here (environment variables take precedence)
# groq_api_key: ""
# gemini_api_key: ""
# mistral_api_key: ""
# openrouter_api_key: ""

# Ollama-specific (if provider: "ollama")
# base_url: "http://localhost:11434/v1"

# OpenAI-compatible specific (if provider: "openai_compatible")
# base_url: "https://api.groq.com/openai/v1"
# api_key: ""